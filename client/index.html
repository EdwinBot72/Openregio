        <h1>OpenRegio — Coöperatie voor lokale ondernemers in Nederland</h1>

        <img src="/img/hero-landscape.jpg" alt="OpenRegio platform voor lokale ondernemers in Nederland — overzicht van diensten en netwerk" />

        <p>
          OpenRegio is de coöperatie voor lokale ondernemers in heel Nederland. Wij helpen jou als ondernemer om grip te krijgen
          op de lokale wet- en regelgeving, gemeentelijke verordeningen, subsidies en aanbestedingen die jouw bedrijf direct raken.
          Samen met andere leden bouw je aan een sterkere, eerlijkere regio. Transparantie, samenwerking en lokale kennis staan
          centraal in alles wat we doen.
        </p>

        <h2>Wat biedt OpenRegio?</h2>
        <ul>
          <li><strong>RegioBot AI</strong> — Stel vragen over WOO-documenten, gemeentebesluiten en mandaatregisters. Altijd een antwoord met bronverwijzing. Ideaal voor ondernemers die willen weten waarom een besluit genomen is en welke regels er gelden.</li>
          <li><strong>Basischeck</strong> — Controleer in enkele minuten of jouw onderneming voldoet aan de belangrijkste regels in jouw regio: van vergunningplicht tot meldingsplicht en van brandveiligheid tot APV-verplichtingen.</li>
          <li><strong>Regio Intel</strong> — Blijf automatisch op de hoogte van relevante wijzigingen in wetgeving, lokaal beleid, subsidies en financiële regelingen die jouw gemeente en sector raken.</li>
          <li><strong>WOO-bibliotheek</strong> — Upload en analyseer WOO-verzoeken, gemeentelijke besluiten en correspondentie met overheden. Maak gebruik van AI om documenten samen te vatten en gaten te vinden.</li>
          <li><strong>Lokaal netwerk</strong> — Verbind je met andere ondernemers in jouw gemeente of regio. Deel kennis, ervaringen en kansen. Stem mee op coöperatieve besluiten die jou raken.</li>
          <li><strong>Website Scan</strong> — Laat je bedrijfswebsite scannen op vindbaarheid, lokale aanwezigheid, technische kwaliteit en SEO-signalen.</li>
        </ul>

        <img src="/img/regiobot.png" alt="RegioBot — AI-assistent voor WOO-documenten en gemeentebesluiten voor lokale ondernemers" />

        <h2>Voor welke ondernemers?</h2>
        <p>
          OpenRegio is er voor zzp'ers, mkb-ondernemers, horecabedrijven, bouwbedrijven, detailhandelaren, ambachtslieden
          en andere lokale ondernemingen in Nederland. Of je nu actief bent in Amsterdam, Rotterdam, Eindhoven, Groningen,
          Den Haag, Utrecht, Breda, Tilburg, Maastricht of een kleinere gemeente — onze tools en ons netwerk zijn voor jou
          beschikbaar. Wij dekken alle 12 provincies en meer dan 300 gemeenten.
        </p>

        <h2>Lokale zoekwoorden &amp; onderwerpen</h2>
        <p>
          OpenRegio helpt bij vragen over: gemeentelijke verordening, APV (Algemene Plaatselijke Verordening), bestemmingsplan,
          omgevingsvergunning, horecavergunning, terrasvergunning, reclamebeleid, subsidieaanvraag, WOO-verzoek opstellen,
          mandaatbesluit, delegatie gemeentebestuur, aanbestedingsregels, milieuvergunning, bouwvergunning, brandveiligheid,
          leges en heffingen, toeristenbelasting, reclamebelasting, ondernemersfonds, bedrijveninvesteringszone (BIZ),
          gemeentelijk inkoopbeleid en lokale belastingen voor ondernemers.
        </p>

        <h2>Lidmaatschap</h2>
        <p>
          Word lid als <strong>Basis-lid</strong> voor €12,95 excl. BTW per maand en krijg toegang tot het coöperatieve netwerk,
          stemrecht en de basistools. Of kies het <strong>Pro-lidmaatschap</strong> voor €24,95 excl. BTW per maand voor
          volledige toegang tot RegioBot, de WOO-bibliotheek en prioriteitsondersteuning.
        </p>
        <p>

        </p>
