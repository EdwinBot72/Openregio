name: E2E tests

on:
  push:
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openregio
          POSTGRES_PASSWORD: openregio
          POSTGRES_DB: openregio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openregio -d openregio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      NODE_ENV: development
      PORT: "5000"
      DATABASE_URL: postgres://openregio:openregio@localhost:5432/openregio_test
      SESSION_SECRET: ci-session-secret-not-for-production
      E2E_BASE_URL: http://localhost:5000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Push database schema
        run: npm run db:push

      - name: Start dev server
        run: |
          nohup npm run dev > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for dev server
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5000/ >/dev/null 2>&1; then
              echo "Server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not start in time" >&2
          tail -n 200 server.log >&2 || true
          exit 1

      - name: Run Playwright tests
        run: npx playwright test

      - name: Stop dev server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
          retention-days: 7
