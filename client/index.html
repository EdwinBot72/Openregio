      <div class="noscript-content">
        <h1>OpenRegio — Coöperatie voor lokale ondernemers in Nederland</h1>

        <p>
          OpenRegio is de coöperatie voor lokale ondernemers in heel Nederland. Wij helpen jou als ondernemer om grip te krijgen
          op de lokale wet- en regelgeving, gemeentelijke verordeningen, subsidies en aanbestedingen die jouw bedrijf direct raken.
          Samen met andere leden bouw je aan een sterkere, eerlijkere regio.
        </p>

        <h2>Wat biedt OpenRegio?</h2>
        <ul>
          <li><strong>RegioBot AI</strong> — Stel vragen over WOO-documenten, gemeentebesluiten en mandaatregisters. Altijd een antwoord met bronverwijzing.</li>
          <li><strong>Basischeck</strong> — Controleer in enkele minuten of jouw onderneming voldoet aan de belangrijkste regels in jouw regio.</li>
          <li><strong>Regio Intel</strong> — Blijf automatisch op de hoogte van relevante wijzigingen in wetgeving, lokaal beleid, subsidies en financiële regelingen.</li>
          <li><strong>WOO-bibliotheek</strong> — Upload en analyseer WOO-verzoeken, gemeentelijke besluiten en correspondentie met overheden.</li>
          <li><strong>Lokaal netwerk</strong> — Verbind je met andere ondernemers in jouw gemeente of regio en deel kennis en ervaringen.</li>
          <li><strong>Website Scan</strong> — Laat je bedrijfswebsite scannen op vindbaarheid, lokale aanwezigheid en technische kwaliteit.</li>
        </ul>

        <h2>Voor welke ondernemers?</h2>
        <p>
          OpenRegio is er voor zzp'ers, mkb-ondernemers, horecabedrijven, bouwbedrijven, detailhandelaren en andere lokale
          ondernemingen in Nederland. Of je nu actief bent in Amsterdam, Rotterdam, Eindhoven, Groningen of een kleinere gemeente —
          onze tools en ons netwerk zijn voor jou beschikbaar.
        </p>

        <h2>Lidmaatschap</h2>
        <p>
          Word lid als <strong>Basis-lid</strong> voor €12,95 excl. BTW per maand en krijg toegang tot het coöperatieve netwerk,
          stemrecht en de basistools. Of kies het <strong>Pro-lidmaatschap</strong> voor €24,95 excl. BTW per maand voor
          volledige toegang tot RegioBot, de WOO-bibliotheek en prioriteitsondersteuning.
        </p>
        <p>
          <a href="/lidmaatschap">Bekijk alle lidmaatschapsopties</a> — opzegbaar per maand, geen verplichtingen.
        </p>

        <h2>Wet- en regelgeving voor ondernemers</h2>
        <p>
          Als lokaal ondernemer heb je te maken met gemeentelijke verordeningen, APV (Algemene Plaatselijke Verordening),
          bestemmingsplannen, milieuregels, horecavergunningen, terrasvergunningen, reclamebeleid en veel meer.
          OpenRegio maakt deze regelgeving inzichtelijk en helpt je begrijpen wat er van jou verwacht wordt.
        </p>
