<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Fonts worden lokaal gehost - geen externe CDN calls -->

    <!-- Primary meta -->
    <title>OpenRegio — Coöperatie voor lokale ondernemers</title>
    <meta name="description" content="OpenRegio is de coöperatie voor lokale ondernemers. Inzicht in wet- en regelgeving, WOO-biblioteek, RegioBot AI en een sterk lokaal netwerk — allemaal op één plek." />
    <meta name="keywords" content="lokale ondernemers, coöperatie, wet en regelgeving, WOO, RegioBot, gemeente, regio, Nederland" />
    <meta name="author" content="OpenRegio" />
    <link rel="canonical" href="https://www.openregio.nl/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenRegio" />
    <meta property="og:title" content="OpenRegio — Coöperatie voor lokale ondernemers" />
    <meta property="og:description" content="OpenRegio is de coöperatie voor lokale ondernemers. Inzicht in wet- en regelgeving, WOO-bibliotheek, RegioBot AI en een sterk lokaal netwerk." />
    <meta property="og:url" content="https://www.openregio.nl/" />
    <meta property="og:image" content="https://www.openregio.nl/img/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="nl_NL" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OpenRegio — Coöperatie voor lokale ondernemers" />
    <meta name="twitter:description" content="OpenRegio is de coöperatie voor lokale ondernemers. Inzicht in wet- en regelgeving, WOO-bibliotheek, RegioBot AI en een sterk lokaal netwerk." />
    <meta name="twitter:image" content="https://www.openregio.nl/img/og-image.png" />

    <!-- JSON-LD: LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "OpenRegio",
      "url": "https://www.openregio.nl",
      "logo": "https://www.openregio.nl/favicon.png",
      "description": "OpenRegio is de coöperatie voor lokale ondernemers in Nederland. Wij bieden inzicht in wet- en regelgeving, WOO-bibliotheek, RegioBot AI-assistent en een krachtig lokaal netwerk.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "NL"
      },
      "areaServed": {
        "@type": "Country",
        "name": "Nederland"
      },
      "sameAs": [
        "https://www.linkedin.com/company/openregio"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
