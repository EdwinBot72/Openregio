name: E2E tests

on:
  push:
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openregio
          POSTGRES_PASSWORD: openregio
          POSTGRES_DB: openregio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openregio -d openregio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      NODE_ENV: development
      PORT: "5000"
      DATABASE_URL: postgres://openregio:openregio@localhost:5432/openregio_test
      SESSION_SECRET: ci-session-secret-not-for-production
      E2E_BASE_URL: http://localhost:5000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Push database schema
        run: npm run db:push

      - name: Start dev server
        run: |
          nohup npm run dev > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for dev server
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5000/ >/dev/null 2>&1; then
              echo "Server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not start in time" >&2
          tail -n 200 server.log >&2 || true
          exit 1

      - name: Run Playwright tests
        run: npx playwright test

      - name: Stop dev server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
          retention-days: 7

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL secret not configured; skipping Slack notification."
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          REF_NAME="${GITHUB_REF_NAME:-${GITHUB_REF}}"
          TEXT=":rotating_light: *E2E tests gefaald* op \`${REF_NAME}\` (${GITHUB_EVENT_NAME})\n*Repo:* ${GITHUB_REPOSITORY}\n*Commit:* \`${GITHUB_SHA:0:8}\` door ${GITHUB_ACTOR}\n*Run:* ${RUN_URL}"
          PAYLOAD=$(jq -n --arg text "$TEXT" '{text: $text}')
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" || echo "Slack notification failed (non-fatal)"

      - name: Notify Slack on recovery (rood -> groen)
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL secret not configured; skipping recovery notification."
            exit 0
          fi
          PREV_STATUS=$(gh run list \
            --workflow "${GITHUB_WORKFLOW}" \
            --branch "${GITHUB_REF_NAME}" \
            --limit 5 \
            --json databaseId,conclusion,status \
            --jq "[.[] | select(.status==\"completed\" and (.databaseId|tostring)!=\"${GITHUB_RUN_ID}\")][0].conclusion" 2>/dev/null || echo "")
          echo "Previous run conclusion on this branch: '${PREV_STATUS}'"
          if [ "$PREV_STATUS" != "failure" ]; then
            echo "No prior failure on this branch; skipping recovery notification."
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          REF_NAME="${GITHUB_REF_NAME:-${GITHUB_REF}}"
          TEXT=":white_check_mark: *E2E tests weer groen* op \`${REF_NAME}\`\n*Repo:* ${GITHUB_REPOSITORY}\n*Commit:* \`${GITHUB_SHA:0:8}\` door ${GITHUB_ACTOR}\n*Run:* ${RUN_URL}"
          PAYLOAD=$(jq -n --arg text "$TEXT" '{text: $text}')
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" || echo "Slack notification failed (non-fatal)"
